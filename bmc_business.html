<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMC Group — Business Insights</title>
<style>
:root {
  --red: #CC2020;
  --red-dim: #8a1515;
  --bg: #0b0b0d;
  --surface: #141416;
  --surface2: #1c1c1f;
  --border: #2a2a2d;
  --text: #f0f0f0;
  --text-dim: #888;
  --green: #22c55e;
  --amber: #f59e0b;
  --red-status: #ef4444;
  --green-dim: rgba(34,197,94,0.12);
  --amber-dim: rgba(245,158,11,0.12);
  --red-dim2: rgba(239,68,68,0.12);
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  padding: 0 0 48px;
}
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 20px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.logo-mark {
  width: 36px;
  height: 36px;
  background: var(--red);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 14px;
  letter-spacing: -0.5px;
  color: #fff;
  flex-shrink: 0;
}
.header-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.header-sub {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 1px;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.last-checked {
  font-size: 12px;
  color: var(--text-dim);
  font-family: var(--mono);
}
.refresh-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.refresh-btn:hover { border-color: var(--red); color: var(--red); }
.status-bar {
  padding: 16px 32px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 32px;
}
.overall-status {
  display: flex;
  align-items: center;
  gap: 10px;
}
.overall-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.overall-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--green);
}
.status-counts {
  display: flex;
  gap: 20px;
}
.status-count {
  font-size: 12px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 5px;
}
.status-count .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.dot-green { background: var(--green); }
.dot-amber { background: var(--amber); }
.dot-red { background: var(--red-status); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
  padding: 28px 32px;
  max-width: 1400px;
  margin: 0 auto;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s;
}
.card:hover { border-color: #3a3a3f; }
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: 12px 12px 0 0;
}
.card.green::before { background: var(--green); }
.card.amber::before { background: var(--amber); }
.card.red::before { background: var(--red-status); }
.card.unknown::before { background: var(--border); }
.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.status-badge.green { background: var(--green-dim); color: var(--green); }
.status-badge.amber { background: var(--amber-dim); color: var(--amber); }
.status-badge.red { background: var(--red-dim2); color: var(--red-status); }
.status-badge.unknown { background: rgba(255,255,255,0.05); color: var(--text-dim); }
.badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.card-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
}
.card-desc {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.5;
  margin-bottom: 16px;
}
.checks {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.check {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: var(--surface2);
  border-radius: 7px;
}
.check-icon {
  font-size: 13px;
  width: 18px;
  text-align: center;
  flex-shrink: 0;
}
.check-label {
  font-size: 12px;
  color: var(--text-dim);
  flex: 1;
}
.check-value {
  font-size: 12px;
  font-family: var(--mono);
  font-weight: 500;
}
.check-value.green { color: var(--green); }
.check-value.amber { color: var(--amber); }
.check-value.red { color: var(--red-status); }
.check-value.dim { color: var(--text-dim); }
.card-note {
  margin-top: 12px;
  padding: 8px 10px;
  background: rgba(245,158,11,0.07);
  border-left: 2px solid var(--amber);
  border-radius: 0 6px 6px 0;
  font-size: 11px;
  color: var(--amber);
  line-height: 1.5;
}
.card-note.red {
  background: rgba(239,68,68,0.07);
  border-left-color: var(--red-status);
  color: var(--red-status);
}
.card-links {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.card-link {
  font-size: 11px;
  color: var(--text-dim);
  text-decoration: none;
  padding: 4px 8px;
  background: var(--surface2);
  border-radius: 4px;
  border: 1px solid var(--border);
  transition: all 0.15s;
}
.card-link:hover { color: var(--text); border-color: #3a3a3f; }
.spinning { animation: spin 1s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.footer {
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  padding: 0 32px;
  margin-top: 8px;
}
@media (max-width: 600px) {
  .grid { padding: 16px; gap: 12px; }
  .header { padding: 14px 16px; }
  .status-bar { padding: 12px 16px; flex-wrap: wrap; gap: 12px; }
}
</style>
</head>
<body>
<header class="header">
  <div class="header-left">
    <div class="logo-mark">BMC</div>
    <div>
      <div class="header-title">BMC Group — Business Insights</div>
      <div class="header-sub">Stock accuracy &amp; reservation follow-ups</div>
    </div>
  </div>
  <div class="header-right">
    <div class="last-checked" id="lastChecked">Last checked: —</div>
    <button class="refresh-btn" onclick="runChecks()">
      <span id="refreshIcon">↻</span> Refresh
    </button>
  </div>
</header>

<div class="status-bar">
  <div class="overall-status">
    <div class="overall-dot" id="overallDot"></div>
    <div class="overall-label" id="overallLabel">Checking systems…</div>
  </div>
  <div class="status-counts">
    <div class="status-count"><div class="dot dot-green"></div><span id="countGreen">0</span> Operational</div>
    <div class="status-count"><div class="dot dot-amber"></div><span id="countAmber">0</span> Degraded</div>
    <div class="status-count"><div class="dot dot-red"></div><span id="countRed">0</span> Down</div>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="footer" id="footer"></div>

<script>
const SERVICES = [
  {
    id: 'reconcile',
    name: 'Stock Reconciliation',
    icon: '🔄',
    desc: "Compares Autotrader stock counts against Sanity's active vehicle counts (Brooke & Norwich), and lists the specific registration(s) causing any mismatch. Refreshed by a scheduled check every 15 minutes. Note: a registration transferring between branches can briefly appear here (typically under 1hr) while the old branch's record finalises — this clears automatically. Persisting longer may indicate a genuine issue.",
    checks: [], // populated dynamically by checkReconcile(), not the generic HTTP checker
    links: [
      { label: 'Reconciliation Workflow', url: 'https://github.com/Ant72-BMC/bmc-dashboards/actions/workflows/reconcile-check.yml' },
      { label: 'Raw Status JSON', url: 'reconcile-status.json' },
    ]
  },
  {
    id: 'reservations',
    name: 'Reservation Alerts',
    icon: '⏱',
    desc: 'Staff follow-up list for £99 deposit reservations: red = ended and already cleared (last 24h), amber = ends today, green = ends tomorrow.',
    checks: [], // populated dynamically by checkReservationAlerts(), not the generic HTTP checker
    links: [
      { label: 'Sanity Vision', url: 'https://bmc-vehicles.sanity.studio/vision' },
      { label: 'Vercel Logs (expire-reservations)', url: 'https://vercel.com/bmcgroup/bmc-website/logs' },
    ]
  },
  {
    id: 'priceband',
    name: 'Sales by Price Band',
    icon: '💷',
    desc: 'Sold vehicles grouped into £2,500 price bands, with average days-to-sell per band. Data covers vehicles sold on or after 29/07/2026, when sale tracking began. Builds up over time as real sales accumulate — this is informational, not a fault indicator.',
    checks: [], // populated dynamically by checkPriceBands(), not the generic HTTP checker
    links: [
      { label: 'Sanity Vision', url: 'https://bmc-vehicles.sanity.studio/vision' },
    ]
  },
  {
    id: 'makemodel',
    name: 'Sales by Make & Model',
    icon: '🚗',
    desc: 'Sold vehicles grouped by make and model, ranked highest-selling to lowest. Data covers vehicles sold on or after 29/07/2026, when sale tracking began. Builds up over time as real sales accumulate — this is informational, not a fault indicator.',
    checks: [], // populated dynamically by checkMakeModel(), not the generic HTTP checker
    links: [
      { label: 'Sanity Vision', url: 'https://bmc-vehicles.sanity.studio/vision' },
    ]
  },
  {
    id: 'location',
    name: 'Sales by BMC Branch',
    icon: '📍',
    desc: 'Sold vehicles grouped by branch, ranked highest-selling to lowest. Data covers vehicles sold on or after 29/07/2026, when sale tracking began. Builds up over time as real sales accumulate — this is informational, not a fault indicator.',
    checks: [], // populated dynamically by checkByLocation(), not the generic HTTP checker
    links: [
      { label: 'Sanity Vision', url: 'https://bmc-vehicles.sanity.studio/vision' },
    ]
  },
];

let results = {};

async function checkUrl(url, expect) {
  try {
    const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, {
      signal: AbortSignal.timeout(8000)
    });
    return { ok: true, status: 200 };
  } catch(e) {
    try {
      const res2 = await fetch(url, {
        method: 'HEAD',
        signal: AbortSignal.timeout(5000),
        mode: 'no-cors'
      });
      return { ok: true, status: 0 };
    } catch(e2) {
      return { ok: false, status: 0, error: e2.message };
    }
  }
}

async function checkReconcile(svc) {
  try {
    const res = await fetch('https://raw.githubusercontent.com/Ant72-BMC/bmc-dashboards/main/reconcile-status.json?t=' + Date.now(), { signal: AbortSignal.timeout(8000) });
    if (!res.ok) throw new Error('status file unreachable');
    const data = await res.json();
    if (!data.ok) {
      results['reconcile'] = [{ label: 'Last check', ok: false, value: 'Failed' }];
      svc.note = { type: 'red', text: `Reconciliation check failed: ${data.error || 'unknown error'}` };
      return;
    }
    const checks = [
      { label: 'Total (Autotrader / Sanity)', ok: data.match, value: `${data.autotraderTotal} / ${data.sanityTotal}` }
    ];
    for (const a of Object.values(data.byAdvertiser)) {
      checks.push({ label: `${a.location} (AT / Sanity)`, ok: a.match, value: `${a.autotrader} / ${a.sanity}` });
      // List the SPECIFIC registrations causing a mismatch, if any, rather
      // than just showing the count difference. Comes straight from
      // reconcile-check.js's registration-level diff.
      if (a.onlyInSanity && a.onlyInSanity.length) {
        checks.push({
          label: `Not currently on Autotrader's ${a.location} forecourt (may be listed elsewhere)`,
          ok: false,
          value: a.onlyInSanity.join(', ') + (a.onlyInSanityTruncated ? ' (+more, see reconcile-status.json)' : '')
        });
      }
      if (a.onlyInAutotrader && a.onlyInAutotrader.length) {
        checks.push({
          label: `Live on Autotrader's ${a.location} forecourt, not yet in Sanity`,
          ok: false,
          value: a.onlyInAutotrader.join(', ') + (a.onlyInAutotraderTruncated ? ' (+more, see reconcile-status.json)' : '')
        });
      }
    }
    results['reconcile'] = checks;
    const mismatches = Object.values(data.byAdvertiser).filter(a => !a.match);
    const hasFailedSync = data.failedSyncCount && data.failedSyncCount > 0;
    if (hasFailedSync) {
      checks.push({ label: 'Failed Sanity writes (failedSync)', ok: false, value: `${data.failedSyncCount}` });
    }
    const noteParts = [];
    if (mismatches.length) {
      noteParts.push(`Location split mismatch — ${mismatches.map(a => `${a.location} diff ${a.diff > 0 ? '+' : ''}${a.diff}`).join(' · ')}. Specific registration(s) listed above.`);
    }
    if (hasFailedSync) {
      noteParts.push(`${data.failedSyncCount} vehicle(s) failed to sync to Sanity even after retries — check the failedSync records in Sanity Vision`);
    }
    svc.note = noteParts.length
      ? { type: hasFailedSync ? 'red' : 'amber', text: `${noteParts.join('. ')}. Checked ${new Date(data.timestamp).toLocaleString('en-GB')}.` }
      : null;
  } catch (e) {
    results['reconcile'] = [{ label: 'Status file', ok: false, value: 'Unreachable' }];
    svc.note = { type: 'red', text: 'Could not load reconcile-status.json' };
  }
}

// Explicit per-card status override, set by checks whose severity can't be
// derived purely from a mix of ok:true/false rows (e.g. reservation alerts,
// where "red" must win over "amber" even if most rows are fine). Checked
// first by getCardStatus() before falling back to the generic ok-array logic.
const statusOverrides = {};

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function fmtAgo(iso) {
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 60) return `${mins}m ago`;
  return `${Math.floor(mins / 60)}h ${mins % 60}m ago`;
}

async function checkReservationAlerts(svc) {
  try {
    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
    const todayEnd = new Date(todayStart.getTime() + 86400000);
    const tomorrowEnd = new Date(todayEnd.getTime() + 86400000);
    const cutoff24h = new Date(now.getTime() - 86400000);

    const groq = `{
      "redList": *[_type == "reservationCleared" && clearedAt >= $cutoff24h] | order(clearedAt desc) {
        registration, customerName, clearedAt
      },
      "amberList": *[_type == "vehicle" && reserved.isReserved == true
        && reserved.reservedUntil >= $todayStart && reserved.reservedUntil < $todayEnd]{
        "registration": identity.registration, "customerName": reserved.customerName,
        "reservedUntil": reserved.reservedUntil
      },
      "greenList": *[_type == "vehicle" && reserved.isReserved == true
        && reserved.reservedUntil >= $todayEnd && reserved.reservedUntil < $tomorrowEnd]{
        "registration": identity.registration, "customerName": reserved.customerName,
        "reservedUntil": reserved.reservedUntil
      }
    }`;

    const params = {
      cutoff24h: cutoff24h.toISOString(),
      todayStart: todayStart.toISOString(),
      todayEnd: todayEnd.toISOString(),
      tomorrowEnd: tomorrowEnd.toISOString(),
    };

    const qs = new URLSearchParams({ query: groq });
    for (const [k, v] of Object.entries(params)) qs.set('$' + k, JSON.stringify(v));

    const res = await fetch(
      `https://0d5aee7t.api.sanity.io/v2021-10-21/data/query/production?${qs.toString()}`,
      { signal: AbortSignal.timeout(8000) }
    );
    if (!res.ok) throw new Error('query failed');
    const data = await res.json();
    const { redList = [], amberList = [], greenList = [] } = data.result || {};

    if (redList.length === 0 && amberList.length === 0 && greenList.length === 0) {
      results['reservations'] = [{ label: 'Reservation alerts', ok: true, value: 'None pending' }];
      statusOverrides['reservations'] = 'green';
      svc.note = null;
      return;
    }

    const rows = [
      ...redList.map(r => ({
        label: `🔴 ${r.registration || 'Unknown reg'} (${r.customerName || 'unknown customer'})`,
        ok: false,
        value: `cleared ${fmtAgo(r.clearedAt)}`
      })),
      ...amberList.map(a => ({
        label: `🟠 ${a.registration || 'Unknown reg'} (${a.customerName || 'unknown customer'})`,
        ok: false,
        value: `ends today ${fmtTime(a.reservedUntil)}`
      })),
      ...greenList.map(g => ({
        label: `🟢 ${g.registration || 'Unknown reg'} (${g.customerName || 'unknown customer'})`,
        ok: true,
        value: `ends tomorrow ${fmtTime(g.reservedUntil)}`
      })),
    ];

    results['reservations'] = rows;

    if (redList.length > 0) {
      statusOverrides['reservations'] = 'red';
      svc.note = { type: 'red', text: `${redList.length} reservation(s) ended in the last 24hrs and sale was not completed — worth a follow-up call?` };
    } else if (amberList.length > 0) {
      statusOverrides['reservations'] = 'amber';
      svc.note = { type: 'amber', text: `${amberList.length} reservation(s) end today.` };
    } else {
      statusOverrides['reservations'] = 'green';
      svc.note = { type: 'amber', text: `${greenList.length} reservation(s) end tomorrow.` };
    }
  } catch (e) {
    results['reservations'] = [{ label: 'Query', ok: false, value: 'Unreachable' }];
    statusOverrides['reservations'] = 'red';
    svc.note = { type: 'red', text: 'Could not query Sanity for reservation alerts' };
  }
}

// Purely informational — never red/amber for "few sales so far", only red if
// the query itself genuinely fails. Bands are £2,500 wide, starting at £0.
const PRICE_BAND_WIDTH = 2500;

function priceBandLabel(bandStart) {
  const lower = (bandStart / 1000).toFixed(1).replace(/\.0$/, '');
  const upper = ((bandStart + PRICE_BAND_WIDTH) / 1000).toFixed(1).replace(/\.0$/, '');
  return `£${lower}k–£${upper}k`;
}

async function checkPriceBands(svc) {
  try {
    const groq = `*[_type == "vehicleSold" && defined(finalPrice)]{ finalPrice, daysToSell }`;
    const res = await fetch(
      `https://0d5aee7t.api.sanity.io/v2021-10-21/data/query/production?query=${encodeURIComponent(groq)}`,
      { signal: AbortSignal.timeout(8000) }
    );
    if (!res.ok) throw new Error('query failed');
    const data = await res.json();
    const sales = data.result || [];
    if (sales.length === 0) {
      results['priceband'] = [{ label: 'Sales recorded', ok: true, value: '0 so far' }];
      statusOverrides['priceband'] = 'green';
      svc.note = { type: 'amber', text: 'No sales recorded yet — this card fills in automatically as vehicles sell from today onward. Nothing to worry about, there is simply no history to show yet.' };
      return;
    }

    // Bucket into £2,500 bands.
    const bands = new Map(); // bandStart -> { count, daysSum, daysCount }
    for (const s of sales) {
      const bandStart = Math.floor(s.finalPrice / PRICE_BAND_WIDTH) * PRICE_BAND_WIDTH;
      if (!bands.has(bandStart)) bands.set(bandStart, { count: 0, daysSum: 0, daysCount: 0 });
      const b = bands.get(bandStart);
      b.count++;
      if (typeof s.daysToSell === 'number') {
        b.daysSum += s.daysToSell;
        b.daysCount++;
      }
    }

    // Ranked by how many sold in each band (highest count first) — ties
    // broken by band value (highest price band first) for stable ordering.
    const sortedBands = [...bands.keys()].sort((a, b) => {
      const countDiff = bands.get(b).count - bands.get(a).count;
      if (countDiff !== 0) return countDiff;
      return b - a;
    });

    results['priceband'] = sortedBands.map(bandStart => {
      const b = bands.get(bandStart);
      const avgDays = b.daysCount > 0 ? Math.round(b.daysSum / b.daysCount) : null;
      return {
        label: priceBandLabel(bandStart),
        ok: true,
        value: `${b.count} sold${avgDays != null ? ` · avg ${avgDays}d to sell` : ''}`
      };
    });
    statusOverrides['priceband'] = 'green';
    svc.note = { type: 'amber', text: `${sales.length} sale(s) recorded in total across ${sortedBands.length} price band(s). This is informational — nothing here indicates a problem.` };
  } catch (e) {
    results['priceband'] = [{ label: 'Query', ok: false, value: 'Unreachable' }];
    statusOverrides['priceband'] = 'red';
    svc.note = { type: 'red', text: 'Could not query Sanity for sold-vehicle price bands' };
  }
}

async function checkMakeModel(svc) {
  try {
    const groq = `*[_type == "vehicleSold"]{ make, model, daysToSell }`;
    const res = await fetch(
      `https://0d5aee7t.api.sanity.io/v2021-10-21/data/query/production?query=${encodeURIComponent(groq)}`,
      { signal: AbortSignal.timeout(8000) }
    );
    if (!res.ok) throw new Error('query failed');
    const data = await res.json();
    const sales = data.result || [];
    if (sales.length === 0) {
      results['makemodel'] = [{ label: 'Sales recorded', ok: true, value: '0 so far' }];
      statusOverrides['makemodel'] = 'green';
      svc.note = { type: 'amber', text: 'No sales recorded yet — this card fills in automatically as vehicles sell from today onward. Nothing to worry about, there is simply no history to show yet.' };
      return;
    }

    // Group by make + model (falling back to "Unknown" for either missing field).
    const groups = new Map(); // key -> { make, model, count, daysSum, daysCount }
    for (const s of sales) {
      const make = s.make || 'Unknown';
      const model = s.model || 'Unknown';
      const key = `${make}|||${model}`;
      if (!groups.has(key)) groups.set(key, { make, model, count: 0, daysSum: 0, daysCount: 0 });
      const g = groups.get(key);
      g.count++;
      if (typeof s.daysToSell === 'number') {
        g.daysSum += s.daysToSell;
        g.daysCount++;
      }
    }

    // Ranked highest-selling to lowest; ties broken alphabetically for stability.
    const ranked = [...groups.values()].sort((a, b) => {
      if (b.count !== a.count) return b.count - a.count;
      return `${a.make} ${a.model}`.localeCompare(`${b.make} ${b.model}`);
    });

    results['makemodel'] = ranked.map(g => {
      const avgDays = g.daysCount > 0 ? Math.round(g.daysSum / g.daysCount) : null;
      return {
        label: `${g.make} ${g.model}`,
        ok: true,
        value: `${g.count} sold${avgDays != null ? ` · avg ${avgDays}d to sell` : ''}`
      };
    });
    statusOverrides['makemodel'] = 'green';
    svc.note = { type: 'amber', text: `${sales.length} sale(s) recorded across ${ranked.length} make/model combination(s). This is informational — nothing here indicates a problem.` };
  } catch (e) {
    results['makemodel'] = [{ label: 'Query', ok: false, value: 'Unreachable' }];
    statusOverrides['makemodel'] = 'red';
    svc.note = { type: 'red', text: 'Could not query Sanity for sold-vehicle make/model breakdown' };
  }
}

async function checkByLocation(svc) {
  try {
    const groq = `*[_type == "vehicleSold"]{ location }`;
    const res = await fetch(
      `https://0d5aee7t.api.sanity.io/v2021-10-21/data/query/production?query=${encodeURIComponent(groq)}`,
      { signal: AbortSignal.timeout(8000) }
    );
    if (!res.ok) throw new Error('query failed');
    const data = await res.json();
    const sales = data.result || [];
    if (sales.length === 0) {
      results['location'] = [{ label: 'Sales recorded', ok: true, value: '0 so far' }];
      statusOverrides['location'] = 'green';
      svc.note = { type: 'amber', text: 'No sales recorded yet — this card fills in automatically as vehicles sell from today onward. Nothing to worry about, there is simply no history to show yet.' };
      return;
    }

    // Group by location (falling back to "Unknown" for missing/null values).
    const groups = new Map(); // location -> count
    for (const s of sales) {
      const loc = s.location || 'Unknown';
      groups.set(loc, (groups.get(loc) || 0) + 1);
    }

    // Ranked highest-selling to lowest; ties broken alphabetically for stability.
    const ranked = [...groups.entries()].sort((a, b) => {
      if (b[1] !== a[1]) return b[1] - a[1];
      return a[0].localeCompare(b[0]);
    });

    results['location'] = ranked.map(([loc, count]) => ({
      label: loc,
      ok: true,
      value: `${count} sold`
    }));
    statusOverrides['location'] = 'green';
    svc.note = { type: 'amber', text: `${sales.length} sale(s) recorded across ${ranked.length} location(s). This is informational — nothing here indicates a problem.` };
  } catch (e) {
    results['location'] = [{ label: 'Query', ok: false, value: 'Unreachable' }];
    statusOverrides['location'] = 'red';
    svc.note = { type: 'red', text: 'Could not query Sanity for sold-vehicle location breakdown' };
  }
}

async function runChecks() {
  const icon = document.getElementById('refreshIcon');
  icon.classList.add('spinning');
  document.getElementById('overallLabel').textContent = 'Checking systems…';

  const checks = [];
  for (const svc of SERVICES) {
    if (svc.id === 'reconcile' || svc.id === 'reservations' || svc.id === 'priceband' || svc.id === 'makemodel' || svc.id === 'location') continue;
    for (const chk of svc.checks) {
      checks.push({ svcId: svc.id, chk });
    }
  }

  await Promise.all([
    ...checks.map(async ({ svcId, chk }) => {
      const result = await checkUrl(chk.url, chk.expect);
      if (!results[svcId]) results[svcId] = [];
      results[svcId].push({ label: chk.label, ok: result.ok });
    }),
    ...SERVICES.filter(s => s.id === 'reconcile').map(svc => checkReconcile(svc)),
    ...SERVICES.filter(s => s.id === 'reservations').map(svc => checkReservationAlerts(svc)),
    ...SERVICES.filter(s => s.id === 'priceband').map(svc => checkPriceBands(svc)),
    ...SERVICES.filter(s => s.id === 'makemodel').map(svc => checkMakeModel(svc)),
    ...SERVICES.filter(s => s.id === 'location').map(svc => checkByLocation(svc))
  ]);

  renderCards();
  icon.classList.remove('spinning');

  const now = new Date();
  document.getElementById('lastChecked').textContent =
    `Last checked: ${now.toLocaleTimeString('en-GB')}`;

  updateOverall();
}

function getCardStatus(svcId, svc) {
  if (statusOverrides[svcId]) return statusOverrides[svcId];
  const r = results[svcId];
  if (!r || r.length === 0) return 'unknown';
  const allOk = r.every(x => x.ok);
  const someOk = r.some(x => x.ok);
  if (allOk) return 'green';
  if (someOk) return 'amber';
  return 'red';
}

function statusLabel(status) {
  if (status === 'green') return 'Operational';
  if (status === 'amber') return 'Degraded';
  if (status === 'red') return 'Down';
  return 'Checking…';
}

function renderCards() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  for (const svc of SERVICES) {
    const status = getCardStatus(svc.id, svc);
    const card = document.createElement('div');
    card.className = `card ${status}`;

    const isDynamic = svc.id === 'reconcile' || svc.id === 'reservations' || svc.id === 'priceband' || svc.id === 'makemodel' || svc.id === 'location';
    const checkList = (isDynamic ? (results[svc.id] || []) : svc.checks);
    const checks = checkList.map((chk, i) => {
      const r = isDynamic ? chk : (results[svc.id] ? results[svc.id][i] : null);
      const label = isDynamic ? r.label : chk.label;
      const val = r === null ? '…' : (r.value !== undefined ? r.value : (r.ok ? 'Reachable' : 'Unreachable'));
      const cls = r === null ? 'dim' : r.ok ? 'green' : 'red';
      return `<div class="check">
        <span class="check-icon">${r === null ? '○' : r.ok ? '✓' : '✗'}</span>
        <span class="check-label">${label}</span>
        <span class="check-value ${cls}">${val}</span>
      </div>`;
    }).join('');

    const links = svc.links.map(l =>
      `<a class="card-link" href="${l.url}" target="_blank" rel="noopener">${l.label} ↗</a>`
    ).join('');

    const note = svc.note
      ? `<div class="card-note ${svc.note.type}">${svc.note.text}</div>`
      : '';

    card.innerHTML = `
      <div class="card-head">
        <div class="card-icon">${svc.icon}</div>
        <div class="status-badge ${status}">
          <div class="badge-dot"></div>
          ${statusLabel(status)}
        </div>
      </div>
      <div class="card-name">${svc.name}</div>
      <div class="card-desc">${svc.desc}</div>
      <div class="checks">${checks}</div>
      ${note}
      <div class="card-links">${links}</div>
    `;
    grid.appendChild(card);
  }
}

function updateOverall() {
  const statuses = SERVICES.map(s => getCardStatus(s.id, s));
  const green = statuses.filter(s => s === 'green').length;
  const amber = statuses.filter(s => s === 'amber').length;
  const red = statuses.filter(s => s === 'red').length;

  document.getElementById('countGreen').textContent = green;
  document.getElementById('countAmber').textContent = amber;
  document.getElementById('countRed').textContent = red;

  const dot = document.getElementById('overallDot');
  const label = document.getElementById('overallLabel');

  if (red > 0) {
    dot.style.background = 'var(--red-status)';
    dot.style.boxShadow = '0 0 8px var(--red-status)';
    label.style.color = 'var(--red-status)';
    label.textContent = `${red} system${red > 1 ? 's' : ''} down`;
  } else if (amber > 0) {
    dot.style.background = 'var(--amber)';
    dot.style.boxShadow = '0 0 8px var(--amber)';
    label.style.color = 'var(--amber)';
    label.textContent = `${amber} system${amber > 1 ? 's' : ''} degraded`;
  } else {
    dot.style.background = 'var(--green)';
    dot.style.boxShadow = '0 0 8px var(--green)';
    label.style.color = 'var(--green)';
    label.textContent = 'All systems operational';
  }

  document.getElementById('footer').textContent =
    `BMC Group Services Dashboard · ${new Date().toLocaleDateString('en-GB', {weekday:'long', year:'numeric', month:'long', day:'numeric'})}`;
}

renderCards();
updateOverall();
runChecks();

setInterval(runChecks, 5 * 60 * 1000);
</script>
