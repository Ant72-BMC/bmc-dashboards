name: BMC Service Health Check

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  # Also allows manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------
      # VERCEL / WEBSITE — mirrors the "vercel" card on bmc_dashboard.html
      # green = all 3 pages OK · amber = 1-2 OK · red = 0 OK
      # ---------------------------------------------------------------
      - name: Check Website — Homepage
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -L https://brookemotcentre.co.uk)
          echo "Homepage: HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "VERCEL_HOME_OK=true" >> $GITHUB_ENV || echo "VERCEL_HOME_OK=false" >> $GITHUB_ENV

      - name: Check Website — Finance
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -L https://brookemotcentre.co.uk/finance)
          echo "Finance: HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "VERCEL_FIN_OK=true" >> $GITHUB_ENV || echo "VERCEL_FIN_OK=false" >> $GITHUB_ENV

      - name: Check Website — Inventory
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -L https://brookemotcentre.co.uk/inventory)
          echo "Inventory: HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "VERCEL_INV_OK=true" >> $GITHUB_ENV || echo "VERCEL_INV_OK=false" >> $GITHUB_ENV

      # ---------------------------------------------------------------
      # SANITY CMS — mirrors the "sanity" card
      # green = both OK · amber = 1 OK · red = 0 OK
      # ---------------------------------------------------------------
      - name: Check Sanity API
        run: |
          STATUS=$(curl -g -s -o /dev/null -w "%{http_code}" --max-time 10 'https://0d5aee7t.api.sanity.io/v2021-10-21/data/query/production?query=*[_type=="siteSettings"][0]{_id}')
          echo "Sanity API: HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "SANITY_API_OK=true" >> $GITHUB_ENV || echo "SANITY_API_OK=false" >> $GITHUB_ENV

      - name: Check Sanity Studio
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -L https://bmc-vehicles.sanity.studio)
          echo "Sanity Studio: HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "SANITY_STUDIO_OK=true" >> $GITHUB_ENV || echo "SANITY_STUDIO_OK=false" >> $GITHUB_ENV

      # ---------------------------------------------------------------
      # FUEL FINDER — mirrors the "fuel" card, which is intentionally
      # forced green on the dashboard itself (the Gov API is known to be
      # flaky and this avoids constant false alarms). No alert is ever
      # generated for this service — kept here only for visibility in
      # the workflow log, matching the dashboard's own suppression.
      # ---------------------------------------------------------------
      - name: Check Fuel Finder (visibility only — never alerts)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://www.fuel-finder.service.gov.uk)
          CRON_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://brookemotcentre.co.uk/api/cron/fuel-prices)
          echo "Fuel Finder API: HTTP $STATUS (informational only, not alerted on)"
          echo "Fuel cron endpoint: HTTP $CRON_STATUS (informational only, not alerted on)"

      # ---------------------------------------------------------------
      # STOCK RECONCILIATION — mirrors the "reconcile" card exactly,
      # reading the same reconcile-status.json the dashboard reads,
      # rather than re-running the Autotrader/Sanity comparison here.
      # green = counts match & no failedSync · amber = count mismatch only
      # red = failedSync records exist, or the status file itself failed
      # ---------------------------------------------------------------
      - name: Check Stock Reconciliation status
        run: |
          set +e
          curl -s --max-time 10 "https://raw.githubusercontent.com/Ant72-BMC/bmc-dashboards/main/reconcile-status.json?t=$(date +%s)" -o reconcile-status.json
          if [ ! -s reconcile-status.json ]; then
            echo "RECONCILE_STATUS=red" >> $GITHUB_ENV
            echo "RECONCILE_DETAIL=The reconciliation status file itself could not be read." >> $GITHUB_ENV
            exit 0
          fi

          python3 << 'PYEOF'
          import json, os

          with open("reconcile-status.json") as f:
              data = json.load(f)

          env_path = os.environ.get("GITHUB_ENV")

          if not data.get("ok"):
              status = "red"
              detail = f"The reconciliation check itself failed: {data.get('error', 'unknown error')}."
          else:
              mismatches = [a for a in data["byAdvertiser"].values() if not a["match"]]
              failed_count = data.get("failedSyncCount", 0) or 0

              if failed_count > 0:
                  status = "red"
                  detail = f"{failed_count} vehicle(s) have failed to sync to Sanity even after retries (failedSync records present)."
              elif mismatches:
                  status = "amber"
                  parts = [f"{a['location']} — Autotrader {a['autotrader']} / Sanity {a['sanity']}" for a in mismatches]
                  detail = "Stock counts do not currently match: " + "; ".join(parts) + "."
              else:
                  status = "green"
                  detail = f"Autotrader ({data['autotraderTotal']}) and Sanity ({data['sanityTotal']}) counts match."

          with open(env_path, "a") as f:
              f.write(f"RECONCILE_STATUS={status}\n")
              f.write(f"RECONCILE_DETAIL={detail}\n")
          PYEOF

      # ---------------------------------------------------------------
      # VPS SYNC SERVER — mirrors the "vps" card
      # green = both OK · amber = 1 OK · red = 0 OK
      # ---------------------------------------------------------------
      - name: Check VPS reachability
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -k https://159.65.17.84)
          echo "VPS IP: HTTP $STATUS"
          case "$STATUS" in 200|301|302|403|404|502) echo "VPS_IP_OK=true" >> $GITHUB_ENV ;; *) echo "VPS_IP_OK=false" >> $GITHUB_ENV ;; esac

      - name: Check DigitalOcean status
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -L https://status.digitalocean.com)
          echo "DigitalOcean status: HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "DO_STATUS_OK=true" >> $GITHUB_ENV || echo "DO_STATUS_OK=false" >> $GITHUB_ENV

      # ---------------------------------------------------------------
      # WORK OUT EACH CARD'S STATUS AND BUILD THE ALERT, IF NEEDED
      # ---------------------------------------------------------------
      - name: Evaluate card statuses and build alert
        id: summary
        run: |
          python3 << 'PYEOF'
          import os

          def envbool(key):
              return os.environ.get(key, "false") == "true"

          def card_status(oks):
              total = len(oks)
              passed = sum(1 for v in oks if v)
              if passed == total:
                  return "green"
              if passed == 0:
                  return "red"
              return "amber"

          alerts = []  # list of (severity, title, message)

          # --- Vercel / Website ---
          vercel_checks = {
              "Homepage": envbool("VERCEL_HOME_OK"),
              "Finance page": envbool("VERCEL_FIN_OK"),
              "Inventory page": envbool("VERCEL_INV_OK"),
          }
          vstatus = card_status(list(vercel_checks.values()))
          if vstatus == "red":
              alerts.append(("RED", "Website — Down",
                  "The website is completely unreachable. Homepage, Finance and Inventory pages are all failing to respond. Customers cannot currently use the site at all. This needs immediate attention."))
          elif vstatus == "amber":
              failing = [k for k, v in vercel_checks.items() if not v]
              alerts.append(("AMBER", "Website — Degraded",
                  f"The following page(s) are not responding correctly: {', '.join(failing)}. The rest of the site is working, but this should be checked — it may be a deployment issue or a temporary Vercel blip."))

          # --- Sanity CMS ---
          sanity_checks = {
              "Sanity API": envbool("SANITY_API_OK"),
              "Sanity Studio": envbool("SANITY_STUDIO_OK"),
          }
          sstatus = card_status(list(sanity_checks.values()))
          if sstatus == "red":
              alerts.append(("RED", "Sanity CMS — Down",
                  "The Sanity API is unreachable. Vehicle pages and other site content may fail to load for customers. This needs immediate attention."))
          elif sstatus == "amber":
              failing = [k for k, v in sanity_checks.items() if not v]
              if "Sanity Studio" in failing and sanity_checks["Sanity API"]:
                  alerts.append(("AMBER", "Sanity CMS — Studio unreachable",
                      "The Sanity Studio (where content is edited) is currently unreachable, but the live API is still responding, so the website itself should be unaffected. You won't be able to edit vehicle or page content until this recovers."))
              else:
                  alerts.append(("AMBER", "Sanity CMS — Degraded",
                      f"The following check(s) are failing: {', '.join(failing)}."))

          # --- Stock Reconciliation ---
          rstatus = os.environ.get("RECONCILE_STATUS", "red")
          rdetail = os.environ.get("RECONCILE_DETAIL", "Status could not be determined.")
          if rstatus == "red":
              alerts.append(("RED", "Stock Reconciliation — Action needed",
                  f"{rdetail} This is the check that confirms Autotrader and Sanity agree on live stock — please check the failedSync records in Sanity Vision and the reconciliation workflow run history."))
          elif rstatus == "amber":
              alerts.append(("AMBER", "Stock Reconciliation — Mismatch detected",
                  f"{rdetail} A short-lived mismatch during a vehicle transfer is normal and often self-corrects within the hour — but check the dashboard if this persists across two or more checks."))

          # --- VPS Sync Server ---
          vps_checks = {
              "VPS reachable": envbool("VPS_IP_OK"),
              "DigitalOcean platform": envbool("DO_STATUS_OK"),
          }
          vpstatus = card_status(list(vps_checks.values()))
          if vpstatus == "red":
              alerts.append(("RED", "VPS Sync Server — Down",
                  "The VPS server that runs the Autotrader-to-Sanity sync is unreachable. Stock updates will stop flowing through to the website until this is restored. This needs immediate attention."))
          elif vpstatus == "amber":
              failing = [k for k, v in vps_checks.items() if not v]
              alerts.append(("AMBER", "VPS Sync Server — Degraded",
                  f"The following check(s) are failing: {', '.join(failing)}. The sync may still be running — check the Stock Reconciliation status above before assuming stock has stopped updating."))

          gh_out = os.environ["GITHUB_OUTPUT"]

          with open(gh_out, "a") as f:
              if alerts:
                  f.write("has_alerts=true\n")
                  severities = {a[0] for a in alerts}
                  overall = "RED" if "RED" in severities else "AMBER"
                  f.write(f"overall={overall}\n")
                  body_lines = []
                  for sev, title, msg in alerts:
                      body_lines.append(f"[{sev}] {title}\n{msg}\n")
                  body = "\n".join(body_lines)
                  f.write("body<<EOF\n")
                  f.write(body + "\n")
                  f.write("EOF\n")
              else:
                  f.write("has_alerts=false\n")
          PYEOF

      - name: Send alert email
        if: steps.summary.outputs.has_alerts == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.ALERT_EMAIL_ADDRESS }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          to: anthewett@hotmail.com,rafael@switchsocialmarketing.com,sales@brookemotcentre.co.uk
          from: BMC Alerts <${{ secrets.ALERT_EMAIL_ADDRESS }}>
          subject: "BMC Dashboard Alert [${{ steps.summary.outputs.overall }}] — Issues Detected"
          body: |
            BMC Group Service Status — Issues Detected

            ${{ steps.summary.outputs.body }}

            View the live dashboard:
            https://bmc-dashboards.netlify.app

            --- BMC Automated Monitoring (realigned to the live dashboard, July 2026)

      - name: All systems operational
        if: steps.summary.outputs.has_alerts == 'false'
        run: echo "All monitored BMC services are green. No alert sent."
